name: install-witness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  witness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            family: posix
          - os: ubuntu-24.04-arm
            family: posix
          - os: macos-15-intel
            family: posix
          - os: macos-latest
            family: posix
          - os: windows-latest
            family: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: POSIX syntax and portability
        if: matrix.family == 'posix'
        shell: bash
        run: sh tools/syntax.sh
      - name: POSIX witness
        if: matrix.family == 'posix'
        shell: bash
        env:
          HYPERAGENT_WITNESS_DIR: ${{ runner.temp }}/hyperagent-install-witness
          TMPDIR: ${{ runner.temp }}
        run: sh tools/witness.sh
      - name: POSIX red checks
        if: matrix.family == 'posix'
        shell: bash
        env:
          HYPERAGENT_WITNESS_DIR: ${{ runner.temp }}/hyperagent-install-red
          TMPDIR: ${{ runner.temp }}
        run: sh tools/red.sh
      - name: PowerShell syntax
        if: matrix.family == 'windows'
        shell: powershell
        run: powershell -NoProfile -File tools/syntax.ps1
      - name: Windows witness
        if: matrix.family == 'windows'
        shell: powershell
        env:
          HYPERAGENT_WITNESS_DIR: ${{ runner.temp }}\hyperagent-install-witness
        run: powershell -NoProfile -File tools/witness.ps1
      - name: Windows red checks
        if: matrix.family == 'windows'
        shell: powershell
        env:
          HYPERAGENT_WITNESS_DIR: ${{ runner.temp }}\hyperagent-install-red
        run: powershell -NoProfile -File tools/red.ps1
